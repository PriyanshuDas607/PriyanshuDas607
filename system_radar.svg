<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <style>
      .bg { fill: #0a0410; }
      .grid { stroke: rgba(139, 61, 255, 0.4); stroke-width: 1; fill: none; }
      .axis { stroke: rgba(139, 61, 255, 0.6); stroke-width: 1.5; }
      .data { fill: rgba(139, 61, 255, 0.5); stroke: #d4b3ff; stroke-width: 2; }
      .point { fill: #ffffff; filter: drop-shadow(0px 0px 5px #ffffff); }
      .text { fill: #d4b3ff; font-family: 'Courier New', Courier, monospace; font-size: 14px; text-anchor: middle; font-weight: bold;}
    </style>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Transparent Background for GitHub Readme Integration -->
  <rect width="400" height="400" fill="transparent" />

  <!-- Center: 200, 200. Radius: 120. 5 sides. -->
  <g transform="translate(200, 200)">
    <!-- Grid Rings -->
    <!-- 20% -->
    <polygon points="0,-24 22.8,-7.4 14.1,19.4 -14.1,19.4 -22.8,-7.4" class="grid" />
    <!-- 40% -->
    <polygon points="0,-48 45.6,-14.8 28.2,38.8 -28.2,38.8 -45.6,-14.8" class="grid" />
    <!-- 60% -->
    <polygon points="0,-72 68.4,-22.3 42.3,58.2 -42.3,58.2 -68.4,-22.3" class="grid" />
    <!-- 80% -->
    <polygon points="0,-96 91.2,-29.7 56.4,77.6 -56.4,77.6 -91.2,-29.7" class="grid" />
    <!-- 100% -->
    <polygon points="0,-120 114.1,-37.1 70.5,97.1 -70.5,97.1 -114.1,-37.1" class="grid" />

    <!-- Axes -->
    <line x1="0" y1="0" x2="0" y2="-120" class="axis" />
    <line x1="0" y1="0" x2="114.1" y2="-37.1" class="axis" />
    <line x1="0" y1="0" x2="70.5" y2="97.1" class="axis" />
    <line x1="0" y1="0" x2="-70.5" y2="97.1" class="axis" />
    <line x1="0" y1="0" x2="-114.1" y2="-37.1" class="axis" />

    <!-- Labels -->
    <text x="0" y="-135" class="text" filter="url(#glow)">AI / ML</text>
    <text x="135" y="-37" class="text" filter="url(#glow)">Algorithms</text>
    <text x="85" y="115" class="text" filter="url(#glow)">Backend</text>
    <text x="-85" y="115" class="text" filter="url(#glow)">UI / UX</text>
    <text x="-140" y="-37" class="text" filter="url(#glow)">Frontend</text>

    <!-- Data Polygon: Scores: AI: 0.95, Algo: 0.8, Backend: 0.75, UI: 0.70, Front: 0.85 -->
    <polygon points="0,-114 91.3,-29.7 52.9,72.8 -49.4,68.0 -97.0,-31.5" class="data" filter="url(#glow)" />

    <!-- Data Points -->
    <circle cx="0" cy="-114" r="4" class="point" />
    <circle cx="91.3" cy="-29.7" r="4" class="point" />
    <circle cx="52.9" cy="72.8" r="4" class="point" />
    <circle cx="-49.4" cy="68.0" r="4" class="point" />
    <circle cx="-97.0" cy="-31.5" r="4" class="point" />
  </g>
</svg>
